spring:
  application:
    name: ESIDOC-WS


  security:
    oauth2:
      client:
        registration:
          authorization-grant-type: ""
          client-id: ""
          client-secret: ""
          oauth2TokenUri: ""
    apikey:
      api-key: ""
app:
  ldap:
    url:
    base:
    user-dn:
    password:
    pooled: false
    people-root-dn:
    structure-root-dn:
    anonymous-read-only: false
    count-limit: 6000
    timeout: 15000
    user-uid-extractor-pattern:
    user-opaque-id-pattern:
    autorized-responsable-pattern:
    filters:
      emprunteurs:
      parents:
      valid-uai:
  mapping:
    sdetbcdi:
      NomGroupeSDET:
        mapping: equivalentEsidoc
        rank: 1
      NomGroupeSDET_B:
        mapping: equivalentEsidoc
        rank: 2
    sdetToIgnore:
      - NomGroupeSDETToIgnore # parent group
    eleve-bcdi-statut: "Elève"
    autre-bcdi-statut: "Autre"
  esidoc:
    editeur: "editeur"
    export-annuaire-uri: "placeholder/${app.esidoc.editeur}/{rne}"
    rne-dev-qualif: ""
  conf:
    structures-regroupees: {}
  #      placeholderA:
  #        - "placeholderB"
  #        - "placeholderC"
    structures-partagees: []
  #  - ["placeholderA", "placeholderB", "placeholderC"]
  debug:
    debug-mode: none # none, profiles
    debug-uai: "*********"
    profiles:
#      - local
#      - dev
#      - ci
  redis:
    hostName: ""
    userName: ""
    password: ""
    port: "6379"
    databaseIndex: "0"
    mappingPrefix: "${spring.redis.namespace}:mapping"

  delay:
    use-delay: true
    duration-in-minutes: 30